<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Ecoparque Peñas Blancas</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .nf { max-width: 560px; }
        .nf__num {
            font-family: var(--font-display);
            font-size: clamp(120px, 25vw, 220px);
            line-height: 1;
            background: linear-gradient(90deg, var(--sun), var(--green-300), var(--sky));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
            font-weight: 800;
        }
        .nf h1 {
            font-family: var(--font-display);
            font-size: clamp(28px, 5vw, 44px);
            margin-bottom: 14px;
            font-weight: 700;
        }
        .nf p {
            color: var(--muted);
            margin-bottom: 30px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="nf">
        <div class="nf__num">404</div>
        <h1>Te perdiste en el sendero</h1>
        <p>La página que buscas no está en el mapa. Vuelve al inicio y sigue explorando la montaña.</p>
        <a href="/ecoparque-penas-blancas/" class="btn btn--primary">Volver al inicio</a>
    </div>
</body>
</html>
